[tools]
# --- Core Editors & Shell Tools ---
neovim = "latest"
helix = "latest"
starship = "latest"
direnv = "latest"

# --- Cross-Platform Build & C/C++ Toolchain ---
cmake = "latest"    # Cross-platform build generator
ninja = "latest"    # Fast build tool

# --- Runtimes ---
node = "lts"
python = "3.12"
go = "1.22"

# --- CLI Search & Navigation ---
eza = "latest"
fzf = "latest"
fd = "latest"
ripgrep = "latest"
bat = "latest"
jq = "latest"
# curl = "latest"
# git = "latest"
gh = "latest"           # Github official command line interface
git-lfs = "latest"      # Git LFS: mise can manage this extension directly
delta = "latest"        # Git Delta: High-performance pager # This provides the 'delta' binary
zoxide = "latest"
lazygit = "latest"

# --- System Utilities & Monitoring ---
dust = "latest"
fastfetch = "latest"
watchexec = "latest"    # Modern fswatch replacement

# --- Text, Formatting & Diffs ---
difftastic = "latest"   # Installs the 'difft' binary natively

# --- Terminal & Shell Extensions ---
# tmuxinator = "latest"
# zsh = "latest"


[bootstrap.packages]

# --- System Utilities & Monitoring ---
"brew:rich-cli" = "latest"  # Homebrew formula for rich CLI utility
"brew:zlib" = "latest"
"brew:btop" = "latest"     # Homebrew formula for btop

# --- File Transfer & Sync ---
"brew:rsync" = "latest"
"brew:wget" = "latest"
"brew:unison" = "latest"

# --- Fonts & Homebrew Packages ---
"brew-cask:font-jetbrains-mono-nerd-font"  = "latest"

[env]
# --- Environment Variables ---
EDITOR = "zed"
VISUAL = "zed"

[settings]
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

[bootstrap.repos]
# 1. Main Dotfiles Repository
"~/dotfiles" = { url = "https://github.com/phaneendra/dotfiles.git", ref = "master" }

# 2. Oh My Zsh Framework
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", ref = "master" }

# 3. Oh My Zsh Plugins
"~/.oh-my-zsh/custom/plugins/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab.git", ref = "master" }
"~/.oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", ref = "master" }
"~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git", ref = "master" }

[dotfiles]
# 1. Handle your gitconfig specifically as a template file
"~/.gitconfig" = { source = "~/dotfiles/home/.gitconfig", mode = "template" }

# 2. Map all folders inside ~/.config (bat, helix, nvim, etc.) and individual files like starship.toml
"~/.config" = { source = "~/dotfiles/home/.config", mode = "symlink-each" }

# 3. Map individual standalone files that sit directly in your home root
"~/.bash_aliases"      = "~/dotfiles/home/.bash_aliases"
"~/.bash_functions"    = "~/dotfiles/home/.bash_functions"
"~/.bash_logout"       = "~/dotfiles/home/.bash_logout"
"~/.bash_profile"      = "~/dotfiles/home/.bash_profile"
"~/.bashrc"            = "~/dotfiles/home/.bashrc"
"~/.curlrc"            = "~/dotfiles/home/.curlrc"
"~/.gitconfig_aliases" = "~/dotfiles/home/.gitconfig_aliases"
"~/.gitignore_global"  = "~/dotfiles/home/.gitignore_global"
"~/.gitmessage.txt"    = "~/dotfiles/home/.gitmessage.txt"
"~/.profile"           = "~/dotfiles/home/.profile"
"~/.ripgreprc"         = "~/dotfiles/home/.ripgreprc"
"~/.wgetrc"            = "~/dotfiles/home/.wgetrc"
"~/.zshenv"            = "~/dotfiles/home/.zshenv"
"~/.zshrc"             = "~/dotfiles/home/.zshrc"

# 4. Map your personal binaries directory
"~/bin" = { source = "~/dotfiles/home/bin", mode = "symlink-each" }

[tasks.install-fonts-linux]
description = "Fallback font installer & font cache refresh for Linux"
# Task will only execute if this command exits with status 0
sources = ["/etc/os-release"]
run = """
#!/usr/bin/env bash
if [ "$(uname -s)" = "Linux" ]; then
    echo "Checking JetBrains Mono Nerd Font on Linux..."
    FONT_DIR="$HOME/.local/share/fonts"
    mkdir -p "$FONT_DIR"
    if ! fc-list | grep -i "JetBrainsMono" &>/dev/null; then
        echo "Downloading JetBrains Mono Nerd Font..."
        ZIP_FILE="/tmp/JetBrainsMono.zip"
        curl -fLo "$ZIP_FILE" https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip
        unzip -o "$ZIP_FILE" -d "$FONT_DIR"
        rm "$ZIP_FILE"
        fc-cache -fv "$FONT_DIR"
        echo "✓ JetBrains Mono Nerd Font installed and cache updated."
    fi
fi
"""
